[package]
name = "wasm-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
argon2 = "0.5.3"
password-hash = "0.5.0"
zeroize = { version = "1.7.0", features = ["derive"] }
getrandom = { version = "0.2.12", features = ["js"] }
bip39 = { version = "2.1.0", features = ["rand"] }
subtle = "2.5.0"

[profile.release]
opt-level = "s"
lto = true
