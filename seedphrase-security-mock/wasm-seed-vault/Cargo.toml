[package]
name = "wasm-seed-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
getrandom = { version = "0.2", features = ["js"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
hex = "0.4"

[profile.release]
# Optimize for size — reduces Wasm binary footprint
opt-level = "s"
lto = true
